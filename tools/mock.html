<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketDeck 设计稿</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1600px;height:900px;overflow:hidden;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
  body{background:#0b0d14}
  .wall{position:fixed;inset:0;background:
    radial-gradient(60% 55% at 12% 8%, rgba(90,80,220,.55), transparent 70%),
    radial-gradient(55% 55% at 92% 15%, rgba(30,140,160,.35), transparent 70%),
    radial-gradient(60% 60% at 45% 105%, rgba(110,60,140,.4), transparent 70%),
    linear-gradient(135deg,#0a0b12,#0d1020 45%,#0a1118)}
  .menubar{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;
    padding:0 18px;color:#fff;font-size:13px;background:rgba(12,14,22,.45);
    border-bottom:.5px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}
  .menubar b{font-weight:600;letter-spacing:.01em}
  .spacer{flex:1}
  .clock{font-variant-numeric:tabular-nums;opacity:.85}
  .win{position:fixed;border-radius:14px;overflow:hidden;
    background:rgba(24,26,36,.92);border:.8px solid rgba(255,255,255,.12);
    box-shadow:0 30px 70px -18px rgba(0,0,0,.85),0 0 0 .5px rgba(0,0,0,.6)}
  .bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;
    background:rgba(255,255,255,.045);border-bottom:.5px solid rgba(255,255,255,.07)}
  .dot{width:11px;height:11px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .title{font-size:13px;font-weight:600;color:rgba(255,255,255,.92);margin-left:8px}
  .notes{padding:24px 26px;color:#eceef5;font-size:21px;line-height:1.62}
  .notes p{margin-bottom:16px}
  .dim{color:rgba(255,255,255,.45);font-size:18px}
  .clockwin{display:flex;flex-direction:column;align-items:center;justify-content:center;height:216px;gap:6px}
  .big{font-size:76px;font-weight:200;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .date{font-size:17px;color:rgba(255,255,255,.55)}
  .dock{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:14px;
    padding:14px;border-radius:20px;background:rgba(22,25,36,.6);
    border:.8px solid rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(170%);
    box-shadow:0 22px 50px -16px rgba(0,0,0,.8)}
  .app{width:66px;height:66px;border-radius:15px;display:grid;place-items:center;
    box-shadow:0 6px 16px -6px rgba(0,0,0,.7),inset 0 .5px 0 rgba(255,255,255,.25)}
  .app svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .a1{background:linear-gradient(150deg,#ffc65c,#f08a1e)}
  .a2{background:linear-gradient(150deg,#6f9bff,#3b6ff5)}
  .a3{background:linear-gradient(150deg,#9aa4b8,#5b647a)}
  .cursor{position:fixed;width:22px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .tag{position:fixed;right:22px;bottom:22px;font-size:12px;color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div class="wall"></div>

<div class="menubar"><b>PocketDeck</b><span class="spacer"></span><span class="clock">10月31日 21:04</span></div>

<div class="win" style="left:150px;top:120px;width:720px;height:430px">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">笔记</span></div>
  <div class="notes">
    <p>用手机滑动移动光标，轻点一下就是单击。</p>
    <p>点手机上的「键盘」，敲的字会出现在这里。</p>
    <p class="dim">这是 iPhone 接上显示器后，大屏上的样子 —— 不是镜像，没有黑边。</p>
  </div>
</div>

<div class="win" style="left:930px;top:170px;width:470px;height:260px">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">时钟</span></div>
  <div class="clockwin"><div class="big">21:04</div><div class="date">10月31日 星期五</div></div>
</div>

<div class="dock">
  <div class="app a1"><svg viewBox="0 0 24 24"><path d="M7 3.6h7.6L19 7.9v12.5H7z"/><path d="M14.2 3.8v4.3h4.4"/><path d="M10 12h6M10 15.5h6"/></svg></div>
  <div class="app a2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.4 9.6h17.2M3.4 14.4h17.2"/><path d="M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg></div>
  <div class="app a3"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/></svg></div>
</div>

<svg class="cursor" viewBox="0 0 22 28" style="left:800px;top:392px">
  <path d="M2 1 L2 22 L7.5 16.5 L12 26 L16 24.2 L11.5 15 L19 14.5 Z" fill="#fff" stroke="rgba(0,0,0,.7)" stroke-width="1.3"/>
</svg>

<div class="tag">设计稿 · 实际由 Swift 在外接屏上渲染</div>
</body>
</html>
