<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketDeck v3 设计稿</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1600px;height:900px;overflow:hidden;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif}
  body{background:#0b0d14;color:#fff}
  .wall{position:fixed;inset:0;background:
    radial-gradient(60% 55% at 12% 8%, rgba(90,80,220,.50), transparent 70%),
    radial-gradient(55% 55% at 92% 15%, rgba(30,140,160,.32), transparent 70%),
    radial-gradient(60% 60% at 45% 105%, rgba(110,60,140,.38), transparent 70%),
    linear-gradient(135deg,#0a0b12,#0d1020 45%,#0a1118)}
  .win{position:fixed;border-radius:10px;overflow:hidden;
    background:rgba(26,28,38,.97);border:.8px solid rgba(255,255,255,.13);
    box-shadow:0 26px 60px -16px rgba(0,0,0,.85)}
  .bar{height:36px;display:flex;align-items:center;gap:8px;padding-left:12px;
    background:rgba(255,255,255,.05);border-bottom:.5px solid rgba(255,255,255,.08)}
  .bar .ic{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-size:9px}
  .bar .t{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92)}
  .bar .sp{flex:1}
  .wb{display:flex;height:100%;margin-left:auto}
  .wb span{width:46px;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:11px;background:rgba(255,255,255,.045)}
  .wb span.x{background:rgba(184,36,26,.78)}
  /* 抖音竖窗 */
  .dy{position:fixed;left:940px;top:70px;width:440px;height:720px;border-radius:10px;overflow:hidden;
    background:#111;border:.8px solid rgba(255,255,255,.13);box-shadow:0 26px 60px -16px rgba(0,0,0,.85)}
  .dytop{height:36px;display:flex;align-items:center;gap:16px;padding:0 10px;
    background:rgba(255,255,255,.05);border-bottom:.5px solid rgba(255,255,255,.08);font-size:12px}
  .dytop .b{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.75);font-size:12px}
  .dytop .url{flex:1;height:24px;border-radius:5px;background:rgba(255,255,255,.07);
    display:flex;align-items:center;padding:0 8px;font-size:11px;color:rgba(255,255,255,.45)}
  .dypage{height:calc(100% - 36px);background:linear-gradient(180deg,#1b1b22 0%,#0d0d12 60%,#050507 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
  .dypage .logo{font-size:44px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 0 30px rgba(255,60,120,.5)}
  .dypage .sub{font-size:12.5px;color:rgba(255,255,255,.45)}
  .dypage .chip{padding:8px 18px;border-radius:18px;background:rgba(255,255,255,.1);font-size:12.5px;color:#fff}
  .dypage .tip{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.3)}
  /* 开始菜单 */
  .menu{position:fixed;left:8px;top:290px;width:380px;height:556px;border-radius:10px;
    background:rgba(26,28,38,.94);border:.8px solid rgba(255,255,255,.13);
    box-shadow:0 30px 70px -18px rgba(0,0,0,.9);backdrop-filter:blur(24px);padding:0 14px}
  .mh{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);position:absolute}
  .grid{position:absolute;left:14px;display:grid;grid-template-columns:repeat(3,106px);gap:6px}
  .app{height:88px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px}
  .app .tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px}
  .app .lb{font-size:11px;color:rgba(255,255,255,.88);margin-top:6px}
  .wgrid{position:absolute;left:14px;display:grid;grid-template-columns:repeat(4,82px);gap:4px 4px}
  .wap{height:86px;display:flex;flex-direction:column;align-items:center;padding-top:6px}
  .wap .tile{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    font-size:14px;font-weight:700;border:.6px solid rgba(255,255,255,.16)}
  .wap .lb{font-size:10.5px;color:rgba(255,255,255,.85);margin-top:4px;white-space:nowrap}
  .mfoot{position:absolute;left:14px;bottom:8px;font-size:10px;color:rgba(255,255,255,.3)}
  /* 任务栏 */
  .task{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;
    gap:4px;padding:0 8px;background:rgba(18,20,30,.82);backdrop-filter:blur(24px);
    border-top:.5px solid rgba(255,255,255,.1)}
  .start{width:40px;height:34px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;
    grid-template-columns:8px 8px;grid-template-rows:8px 8px;gap:2px;place-content:center}
  .start i{background:#5b8fff;border-radius:1.5px}
  .tb{display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;border-radius:6px;
    background:rgba(255,255,255,.05);font-size:12px;color:rgba(255,255,255,.9);min-width:120px}
  .tb.on{background:rgba(255,255,255,.18)}
  .tb .d{width:16px;height:16px;border-radius:3px}
  .spacer{flex:1}
  .tray{text-align:right;font-size:11.5px;line-height:1.25;color:rgba(255,255,255,.85);padding-right:10px}
  .tray small{color:rgba(255,255,255,.45);font-size:10px}
  .tag{position:fixed;right:18px;bottom:58px;font-size:10.5px;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="wall"></div>

<!-- 抖音竖窗 -->
<div class="dy">
  <div class="dytop">
    <span class="b">‹</span><span class="b">›</span><span class="b">⟳</span>
    <span class="url">https://www.douyin.com</span>
    <div class="wb"><span>–</span><span>□</span><span class="x">✕</span></div>
  </div>
  <div class="dypage">
    <div class="logo">抖音</div>
    <div class="sub">网页版 · 在桌面窗口里直接播</div>
    <div class="chip">推荐 · 推荐 · 关注</div>
    <div class="tip">把窗口竖起来，像手机一样刷</div>
  </div>
</div>

<!-- 开始菜单 -->
<div class="menu">
  <div class="mh" style="top:12px">应用</div>
  <div class="grid" style="top:44px">
    <div class="app"><div class="tile" style="background:#f0a01e">📝</div><div class="lb">笔记</div></div>
    <div class="app"><div class="tile" style="background:#3b6ff5">🌐</div><div class="lb">浏览器</div></div>
    <div class="app"><div class="tile" style="background:#6b9cf7">📁</div><div class="lb">文件</div></div>
    <div class="app"><div class="tile" style="background:#8c95a6">±</div><div class="lb">计算器</div></div>
    <div class="app"><div class="tile" style="background:#2e3440">⌨</div><div class="lb">终端</div></div>
    <div class="app"><div class="tile" style="background:#808a9c">⏱</div><div class="lb">时钟</div></div>
  </div>

  <div class="mh" style="top:236px">网页应用 · 点一下就在大屏打开</div>
  <div class="wgrid" style="top:262px">
    <div class="wap"><div class="tile" style="background:#1e1e1e">抖</div><div class="lb">抖音</div></div>
    <div class="wap"><div class="tile" style="background:#fa709e">B</div><div class="lb">B站</div></div>
    <div class="wap"><div class="tile" style="background:#e62e24">YT</div><div class="lb">YouTube</div></div>
    <div class="wap"><div class="tile" style="background:#ed2e3d">红</div><div class="lb">小红书</div></div>
    <div class="wap"><div class="tile" style="background:#f7701e">微</div><div class="lb">微博</div></div>
    <div class="wap"><div class="tile" style="background:#1f66ea">知</div><div class="lb">知乎</div></div>
    <div class="wap"><div class="tile" style="background:#2675f0">文档</div><div class="lb">腾讯文档</div></div>
    <div class="wap"><div class="tile" style="background:#335ce6">飞</div><div class="lb">飞书</div></div>
    <div class="wap"><div class="tile" style="background:#383838">GH</div><div class="lb">GitHub</div></div>
    <div class="wap"><div class="tile" style="background:#2459f2">百</div><div class="lb">百度</div></div>
  </div>
  <div class="mfoot">抖音 / B站 / YouTube 都是网页版，能播</div>
</div>

<!-- 任务栏 -->
<div class="task">
  <div class="start"><i></i><i></i><i></i><i></i></div>
  <div class="tb on"><span class="d" style="background:#1e1e1e;border:.5px solid rgba(255,255,255,.4)"></span>douyin.com</div>
  <div class="spacer"></div>
  <div class="tray">21:04<br><small>10/31</small></div>
</div>

<div class="tag">设计稿 · 实际由 Swift 在外接屏上渲染</div>
</body>
</html>
