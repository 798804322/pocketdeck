name: Ledger
options:
  bundleIdPrefix: com.pocketdeck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: Ledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketdeck.ledger
        PRODUCT_NAME: Ledger
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Ledger/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      gatherCoverageData: false
