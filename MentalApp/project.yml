name: Mental
options:
  bundleIdPrefix: com.pocketdeck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Mental:
    type: application
    platform: iOS
    sources:
      - path: Mental
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketdeck.mental
        PRODUCT_NAME: Mental
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Mental/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      gatherCoverageData: false
