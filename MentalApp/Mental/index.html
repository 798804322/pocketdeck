<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<title>宇宙精神状态检测中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input{-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:auto}
body{
background:#08080f;color:#e6e6f2;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
overflow:hidden;position:relative;height:100vh;height:100dvh;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.glow{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;opacity:.35}
.g1{width:340px;height:340px;background:#6d3bff;top:-120px;left:-100px}
.g2{width:300px;height:300px;background:#00d4c8;bottom:-140px;right:-100px;opacity:.22}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;padding:0 18px;padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
.screen.on{display:flex;animation:fadeUp .5s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:#9d8cff;border:1px solid rgba(157,140,255,.28);padding:6px 14px;border-radius:100px;margin:0 auto 26px}
.badge i{width:5px;height:5px;border-radius:50%;background:#00ffc8;box-shadow:0 0 8px #00ffc8;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
h1{font-size:34px;line-height:1.28;font-weight:800;letter-spacing:-.5px;margin-bottom:14px;
background:linear-gradient(135deg,#fff 10%,#b49bff 55%,#5ff0dd 95%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:#7c7c94;line-height:1.75;margin-bottom:38px}
.inputbox{position:relative;margin-bottom:14px}
input{width:100%;height:56px;background:rgba(255,255,255,.04);
border:1px solid rgba(157,140,255,.25);border-radius:14px;
color:#fff;font-size:16px;text-align:center;letter-spacing:1px;
outline:none;transition:.25s;font-family:inherit}
input::placeholder{color:#4e4e63;letter-spacing:.5px}
input:focus{border-color:rgba(157,140,255,.7);background:rgba(157,140,255,.07);box-shadow:0 0 0 4px rgba(157,140,255,.1)}
.btn{width:100%;height:56px;border:none;border-radius:14px;cursor:pointer;
font-size:16px;font-weight:700;letter-spacing:2px;color:#0a0a12;
background:linear-gradient(100deg,#a48cff,#5ff0dd 60%,#a48cff);
background-size:200% 100%;transition:.3s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn:hover{background-position:100% 0}
.tip{font-size:11px;color:#4a4a5e;margin-top:20px;line-height:1.9}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.orb{width:110px;height:110px;position:relative;margin-bottom:34px}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(157,140,255,.5);animation:pulse 2.2s ease-out infinite}
.orb::after{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.core{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9b8ff,#6d3bff 60%,#1a0a4a);box-shadow:0 0 40px rgba(109,59,255,.8);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.loadtxt{font-size:13px;color:#9d8cff;letter-spacing:2px;height:20px}
.bar{width:180px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d3bff,#5ff0dd);transition:width .3s linear}
.result{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.rhead{text-align:center;margin-bottom:10px;flex-shrink:0}
.rhead .rid{font-size:10px;color:#5b5b73;letter-spacing:1.2px;margin-bottom:5px}
.rhead .rname{font-size:20px;font-weight:800;line-height:1.3;

.card{background:linear-gradient(160deg,rgba(157,140,255,.09),rgba(255,255,255,.02));

padding:10px 13px;opacity:0;transform:translateY(12px);backdrop-filter:blur(8px);flex-shrink:0}
.card.show{animation:cardIn .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.ctitle{font-size:10px;color:#8b7bd8;letter-spacing:2.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ctitle::before{content:"";width:3px;height:10px;border-radius:2px;background:linear-gradient(#a48cff,#5ff0dd)}
.ctext{font-size:14px;line-height:1.5;color:#e0dff0;font-weight:500}
.ctext em{font-style:normal;color:#5ff0dd}
.muted{font-size:12px;color:#8f8fa8;line-height:1.5;margin-top:4px}
.row{display:flex;gap:8px;font-size:13px;line-height:1.55;margin-bottom:3px}
.row:last-child{margin-bottom:0}
.k{color:#7c7c94;flex-shrink:0;font-size:13px}
.vgood{color:#5ff0dd}
.vbad{color:#ff7a9c}
.lucky{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:3px}
.lk{background:rgba(255,255,255,.035);border:1px solid rgba(157,140,255,.12);border-radius:8px;padding:6px 3px;text-align:center;overflow:hidden}
.lk span{display:block;font-size:9px;color:#6e6e88;margin-bottom:3px;letter-spacing:.3px}
.lk b{font-size:11px;color:#c9b8ff;font-weight:700;white-space:nowrap}
.foot{margin-top:9px;flex-shrink:0}

.wm{text-align:center;font-size:9px;color:#3a3a4c;letter-spacing:.5px;margin-top:7px;line-height:1.5;flex-shrink:0}
</style>
</head>

function hashStr(s){
  var h = 2166136261;
  for(var i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pickN(arr, n, rnd){
  var copy = arr.slice(), out = [];
  for(var i=0;i<n && copy.length;i++){
    out.push(copy.splice(Math.floor(rnd()*copy.length),1)[0]);
  }
  return out;
}

function buildReport(name){
  var seed = hashStr(name);
  var rnd = mulberry32(seed);
  var pick = function(a){ return a[Math.floor(rnd()*a.length)]; };

  var state = pick(POOL.state);
  var color = pick(POOL.color);
  var obj = pick(POOL.obj);
  var notes = pickN(POOL.note, 1, rnd);
  var goods = pickN(POOL.good, 2, rnd);
  var bads = pickN(POOL.bad, 2, rnd);

  var loveA = pick(POOL.loveAnimal);
  var loveAct = pick(POOL.loveAction);
  var loveSc = pick(POOL.loveScene);
  var loveEd = pick(POOL.loveEnd);

  var carA = pick(POOL.careerAnimal);
  var carAct = pick(POOL.careerAction);
  var carTask = pick(POOL.careerTask);

  var hm = pickN(POOL.healthMore, 2, rnd);
  var hl = pickN(POOL.healthLess, 2, rnd);

  var lc = pick(POOL.luckyColor);
  var ln = pick(POOL.luckyNum);
  var lf = pick(POOL.luckyFood);
  var la = pick(POOL.luckyAnimal);

  var idNum = (seed % 9000 + 1000);
  var idPrefix = name.length >= 2 ? name.charAt(0) + name.charAt(1) : name + 'X';

  var d = new Date();
  var dateStr = d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);

  return {
    id: '#' + idPrefix.toUpperCase() + '-' + idNum + '  |  ' + dateStr,
    name: name,

      '<div class="card"><div class="ctitle">性别底色</div>' +

        '<div class="muted">— ' + notes[0] + '</div>' +
      '</div>' +
      '<div class="card"><div class="ctitle">今日宜忌</div>' +
        '<div class="row"><span class="k">宜</span><span class="vgood">' + goods.join('、') + '</span></div>' +
        '<div class="row"><span class="k">忌</span><span class="vbad">' + bads.join('、') + '</span></div>' +
      '</div>' +
      '<div class="card"><div class="ctitle">感情运</div>' +
        '<div class="ctext">你的灵魂伴侣是一只正在<em>' + loveAct + '</em>的<em>' + loveA + '</em></div>' +
        '<div class="muted">— 你们会在' + loveSc + '相遇</div>' +
      '</div>' +
      '<div class="card"><div class="ctitle">事业运</div>' +
        '<div class="ctext">你上辈子是一只正在<em>' + carAct + '</em>的<em>' + carA + '</em></div>' +
        '<div class="muted">— 这辈子你注定要' + carTask + '</div>' +
      '</div>' +
      '<div class="card"><div class="ctitle">健康运</div>' +
        '<div class="ctext">建议你多<em>' + hm.join('</em>、多<em>') + '</em></div>' +
        '<div class="muted">— 少' + hl.join('，少') + '</div>' +
      '</div>' +
      '<div class="card"><div class="ctitle">幸运参数</div>' +
        '<div class="lucky">' +
          '<div class="lk"><span>幸运色</span><b>' + lc + '</b></div>' +
          '<div class="lk"><span>幸运数字</span><b>' + ln + '</b></div>' +
          '<div class="lk"><span>幸运食物</span><b>' + lf + '</b></div>' +
          '<div class="lk"><span>幸运动物</span><b>' + la + '</b></div>' +
        '</div>' +
      '</div>'
  };
}

var scenes = {
  home: document.getElementById('s-home'),
  loading: document.getElementById('s-loading'),
  result: document.getElementById('s-result')
};
function show(key){
  for(var k in scenes){ scenes[k].classList.remove('on'); }
  scenes[key].classList.add('on');
  window.scrollTo(0,0);
}

var pendingName = '';

function startCheck(){
  var v = document.getElementById('nameInput').value.trim();
  if(!v){ v = '无名氏'; }
  pendingName = v;
  show('loading');

  var txtEl = document.getElementById('loadtxt');
  var barEl = document.getElementById('bar');
  var i = 0, total = 7;
  txtEl.textContent = LOADTXT[0];

  var timer = setInterval(function(){
    i++;
    if(i < total){
      txtEl.textContent = LOADTXT[i % LOADTXT.length];
      barEl.style.width = (i/total*100) + '%';
    } else {
      clearInterval(timer);
      barEl.style.width = '100%';
      setTimeout(renderResult, 220);
    }
  }, 420);
}

function renderResult(){
  var rep = buildReport(pendingName);
  document.getElementById('rid').textContent = rep.id;
  document.getElementById('rname').textContent = rep.name + ' 的 精 神 状 态 报 告';
  var box = document.getElementById('cards');
  box.innerHTML = rep.html;
  show('result');

  var cards = box.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    (function(el, idx){
      setTimeout(function(){ el.classList.add('show'); }, 85 * idx + 50);
    })(cards[i], i);
  }
  setTimeout(fitCards, 85 * cards.length + 520);
}

function fitCards(){
  var box = document.getElementById('cards');
  if(!box) return;
  box.style.transform = 'none';
  var availH = box.clientHeight;
  var needH = box.scrollHeight;
  if(availH > 0 && needH > availH + 1){
    var s = Math.max(0.66, (availH - 2) / needH);
    box.style.transform = 'scale(' + s.toFixed(3) + ')';
    box.style.transformOrigin = 'center center';
  }
}

window.addEventListener('resize', function(){
  if(document.getElementById('s-result').classList.contains('on')){ setTimeout(fitCards, 60); }
});
window.addEventListener('orientationchange', function(){
  if(document.getElementById('s-result').classList.contains('on')){ setTimeout(fitCards, 220); }
});

document.getElementById('startBtn').addEventListener('click', startCheck);
document.getElementById('nameInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ startCheck(); }
});
document.getElementById('againBtn').addEventListener('click', function(){
  document.getElementById('nameInput').value = '';
  show('home');
  setTimeout(function(){ document.getElementById('nameInput').focus(); }, 120);
});

/* 星空背景 */
(function(){
  var cv = document.getElementById('stars');
  var ctx = cv.getContext('2d');
  var pts = [], W, H;
  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    pts = [];
    var count = Math.floor(W*H/9000);
    for(var i=0;i<count;i++){
      pts.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.3 + .25,
        a: Math.random()*.6 + .15,
        s: Math.random()*.18 + .04,
        p: Math.random()*Math.PI*2
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      p.p += .015;
      p.y -= p.s;
      if(p.y < -2){ p.y = H + 2; p.x = Math.random()*W; }
      var alpha = p.a * (0.65 + 0.35*Math.sin(p.p));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(190,180,255,' + alpha + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  draw();
})();
</script>
