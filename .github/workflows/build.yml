name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        id: build
        run: |
          set +e
          xcodebuild \
            -project PocketDeck.xcodeproj \
            -scheme PocketDeck \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "xcodebuild exit code: $status"
          tail -n 60 build.log
          if [ $status -ne 0 ]; then
            echo "----- 编译错误摘要（会显示在运行页面顶部）-----"
            grep -m 12 "error:" build.log | while IFS= read -r line; do
              echo "::error title=compile::$line"
              echo "$line"
            done
            exit $status
          fi

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build -name "PocketDeck.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload PocketDeck-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PocketDeck-unsigned.ipa Payload
          ls -lh PocketDeck-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketDeck-ipa
          path: PocketDeck-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
