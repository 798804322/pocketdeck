name: Build SoundField

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  soundfield:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SoundFieldApp
        run: xcodegen generate

      - name: Build (unsigned)
        id: build
        working-directory: SoundFieldApp
        run: |
          set +e
          xcodebuild \
            -project SoundField.xcodeproj \
            -scheme SoundField \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "xcodebuild exit code: $status"
          tail -n 60 build.log
          if [ $status -ne 0 ]; then
            echo "----- 声场编译错误摘要 -----"
            grep -m 12 "error:" build.log | while IFS= read -r line; do
              echo "::error title=soundfield::$line"
              echo "$line"
            done
            exit $status
          fi

      - name: Record build log on failure
        if: failure()
        run: |
          git config user.name "pocketdeck-ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "soundfield build failed: $(date -u)"
            echo ""
            echo "== errors =="
            grep -n "error:" SoundFieldApp/build.log | head -n 40 || true
            echo ""
            echo "== tail 80 =="
            tail -n 80 SoundFieldApp/build.log || true
          } > soundfield-build-error.txt
          git add soundfield-build-error.txt
          git commit -m "ci: record soundfield build error [skip ci]" || true
          git push || true

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find SoundFieldApp/build -name "SoundField.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload SoundField-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SoundField-unsigned.ipa Payload
          ls -lh SoundField-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoundField-ipa
          path: SoundField-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
