name: Build Ledger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: LedgerApp
        run: xcodegen generate

      - name: Build (unsigned)
        id: build
        working-directory: LedgerApp
        run: |
          set +e
          xcodebuild \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "xcodebuild exit code: $status"
          tail -n 60 build.log
          if [ $status -ne 0 ]; then
            echo "----- 账本编译错误摘要 -----"
            grep -m 12 "error:" build.log | while IFS= read -r line; do
              echo "::error title=ledger::$line"
              echo "$line"
            done
            exit $status
          fi

      - name: Record build log on failure
        if: failure()
        run: |
          git config user.name "pocketdeck-ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "ledger build failed: $(date -u)"
            echo ""
            echo "== errors =="
            grep -n "error:" LedgerApp/build.log | head -n 40 || true
            echo ""
            echo "== tail 80 =="
            tail -n 80 LedgerApp/build.log || true
          } > ledger-build-error.txt
          git add ledger-build-error.txt
          git commit -m "ci: record ledger build error [skip ci]" || true
          git push || true

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find LedgerApp/build -name "Ledger.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload Ledger-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Ledger-unsigned.ipa Payload
          ls -lh Ledger-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-ipa
          path: Ledger-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
