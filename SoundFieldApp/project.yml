name: SoundField
options:
  bundleIdPrefix: com.pocketdeck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SoundField:
    type: application
    platform: iOS
    sources:
      - path: SoundField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketdeck.soundfield
        PRODUCT_NAME: SoundField
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SoundField/Info.plist
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      gatherCoverageData: false
