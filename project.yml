name: PocketDeck
options:
  bundleIdPrefix: com.pocketdeck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_MODULE_VERIFIER: "NO"

targets:
  PocketDeck:
    type: application
    platform: iOS
    sources:
      - path: PocketDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketdeck.app
        PRODUCT_NAME: PocketDeck
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        # 关键：直接指定 plist 文件，不让 XcodeGen 重新生成
        # （之前 version / 启动画面 / 状态栏这些键就是被重新生成时丢掉的）
        INFOPLIST_FILE: PocketDeck/Info.plist
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "20"
    scheme:
      testTargets: []
      gatherCoverageData: false
