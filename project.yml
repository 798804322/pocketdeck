name: PocketDeck
options:
  bundleIdPrefix: com.pocketdeck
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_MODULE_VERIFIER: "NO"

targets:
  PocketDeck:
    type: application
    platform: iOS
    sources:
      - path: PocketDeck
    info:
      path: PocketDeck/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketdeck.app
        PRODUCT_NAME: PocketDeck
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
      gatherCoverageData: false
